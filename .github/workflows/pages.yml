name: Pages

# Builds the browser tool in web/ with the firmware file from the latest
# release, checked against its SHA-256, and publishes it to GitHub Pages.
# Publishing a release redeploys the site if the github-pages environment
# allows v* tags. Enable Pages with "GitHub Actions" as the source in the
# repository settings.
#
# Pages keeps the first deployment of each build version, and
# actions/deploy-pages always uses the commit as the version. A release
# published on the commit main was last deployed from then changed nothing
# (0.6.0 did that), so the deploy step below gives every run its own version.

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Get release firmware
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run firmware

      - name: Build site
        working-directory: web
        run: npm run build:site

      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The same API calls as actions/deploy-pages, with a build version of
      # its own for each run.
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          BUILD_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          status_url=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F artifact_id="$ARTIFACT_ID" -f pages_build_version="$BUILD_VERSION" -f oidc_token="$oidc" -q .status_url)
          echo "deployment $BUILD_VERSION"
          status=
          for _ in $(seq 100); do
            sleep 5
            status=$(gh api "$status_url" -q .status || echo unknown_status)
            echo "status: $status"
            case $status in
              succeed) break ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost) exit 1 ;;
            esac
          done
          [ "$status" = succeed ] || { echo "no result after 500 s"; exit 1; }
          echo "page_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .html_url)" >> "$GITHUB_OUTPUT"
